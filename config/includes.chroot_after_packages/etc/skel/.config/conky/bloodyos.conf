conky.config = {
    alignment = 'top_right',
    gap_x = 22,
    gap_y = 60,
    minimum_width = 255,
    maximum_width = 255,

    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_transparent = true,

    double_buffer = true,
    update_interval = 3,
    background = true,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    default_color = 'FFFFFF',
    color1 = 'E53935',
    color2 = 'AAAAAA',
    draw_shades = true,
    draw_outline = false,
    draw_borders = false,
};

conky.text = [[
${color1}${font DejaVu Sans:bold:size=14}BLOODYTECH${font}
${color2}SYSTEM MONITOR LITE
${color1}${hr 2}

${color1}CPU ${alignr}${color white}${cpu}%
${color2}${execi 3600 sh -c "grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//' | cut -c1-35"}
${color1}${cpubar 8,255}
${color2}Frecuencia:${alignr}${color white}${freq} MHz
${color2}Temperatura:${alignr}${color white}${execi 15 sh -c 'for f in /sys/class/thermal/thermal_zone*/temp; do [ -r "$f" ] || continue; read -r t < "$f"; awk -v t="$t" "BEGIN {printf \"%.0f C\", t/1000}"; exit; done; echo "N/D"'}

${color1}MEMORIA RAM
${color white}${mem} / ${memmax}
${color1}${membar 8,255}
${color2}Uso:${alignr}${color white}${memperc}%

${color1}ALMACENAMIENTO
${color2}Raiz: ${alignr}${color white}${fs_used /} / ${fs_size /}
${color1}${fs_bar 8,255 /}

${color1}BATERIA
${color2}Estado:${alignr}${color white}${execi 15 sh -c 'for b in /sys/class/power_supply/BAT*; do [ -r "$b/capacity" ] || continue; cat "$b/capacity" | tr "\n" " "; echo "%"; exit; done; echo N/D'}
${color1}${execibar 15 sh -c 'for b in /sys/class/power_supply/BAT*; do [ -r "$b/capacity" ] && { cat "$b/capacity"; exit; }; done; echo 0'}

${color1}RED
${color2}Interfaz: ${alignr}${color white}${gw_iface}
${color2}Descarga:${alignr}${color white}${execi 3 /usr/local/bin/bloodyos-net-speed rx}
${color2}Subida:${alignr}${color white}${execi 3 /usr/local/bin/bloodyos-net-speed tx}

${color1}${hr 2}
${color2}UPTIME:${alignr}${color white}${uptime}
${color1}${alignc}BLOODYOS LITE
]]

