dontChroot: false
script:
- rm -f /usr/share/applications/bloodyos-installer.desktop
- rm -f /usr/local/bin/bloodyos-installer
- rm -rf /usr/share/bloodyos-live
- find /etc/lightdm -type f -name '*.conf' -exec sed -i -E '/^[[:space:]]*autologin-user(-timeout)?[[:space:]]*=/d'
  {} +
- rm -f /etc/polkit-1/rules.d/49-bloodyos-live-installer.rules
